<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>生成随机密码</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 10px;
      overflow: hidden;
      position: absolute;
      height: 100%;
      width: 100%;
      margin: 0px;
    }

    form {
      width: 100%;
      background-color: rgb(236 245 255);
      border-radius: 10px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    form>div {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    label {
      display: inline-block;
      width: 100px;
      padding: 0px;
      margin: 0px;
      font-size: 16px;
      white-space: nowrap;
    }

    input[type='checkbox'] {
      width: 20px;
      height: 20px;
      border-radius: 3px;
      border: #ccc solid 1px;
      margin-left: 10px;
      cursor: pointer;
      background-color: white;
    }

    input[type='number'],
    input[type='text'] {
      height: 40px;
      padding: 0 20px;
      font-size: 20px;
      line-height: 38px;
      border: 1px solid #ccc;
      width: calc(100% - 100px);
    }

    button {
      height: 40px;
      color: white;
      font-size: 18px;
      cursor: pointer;
      border-radius: 6px;
      background-color: dodgerblue;
      border: none;
      outline: none;
      width: 100%;
    }

    button:hover {
      background-color: deepskyblue;
    }
  </style>
</head>

<body>
  <form id="form">
    <div>
      <label for="length"> 密码长度 </label>
      <input min="6" step="1" type="number" id="length" name="length" value="16" />
    </div>
    <div>
      <label for="specialRange"> 特殊字符范围 </label>
      <input type="text" id="specialRange" name="specialRange" value="@#%&*!_-+$|?~" />
    </div>
    <div>
      <label for="special"> 特殊字符 </label>
      <input type="checkbox" id="special" name="special" checked value="true" />
      <input type="number" name="specialCount" min="1" value="4">
    </div>
    <div>
      <label for="letter"> 字母 </label>
      <input type="checkbox" id="letter" name="letter" checked value="true" />
      <input type="number" name="letterCount" min="1" value="6">
    </div>
    <div>
      <label for="number"> 数字 </label>
      <input type="checkbox" id="number" name="number" checked value="true" />
      <!-- <input type="number" name="numberCount" min="1" value="6"> -->
    </div>

    <div>
      <label for="number"> 随机密码 </label>
      <input type="text" id="password" style="width: 80%" />
    </div>
    <div>
      <button id="btn" style="width: calc(50% - 10px);">生成密码</button>
      <button id="copy" style="width: calc(50% - 10px);">复制密码</button>
    </div>

  </form>


  <form id="form1">
    <div>
      <label for="uuid"> UUID </label>
      <input type="text" id="uuid" name="uuid" />
    </div>

    <div>
      <button id="btn1" style="width: calc(50% - 10px);">生成UUID</button>
      <button id="copy1" style="width: calc(50% - 10px);">复制UUID</button>
    </div>
  </form>

  <script>
    const form = document.getElementById('form');
    const btn = document.getElementById('btn');
    const copyBtn = document.getElementById('copy');
    const passwordInput = document.getElementById('password');

    const letters = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const lettersLength = letters.length * 2;
    const numbers = '0123456789';
    const numbersLength = numbers.length * 2;
    function generatePassword() {
      const length = Number(form.length.value) || 16;
      const useLetters = form.letter.checked;
      const letterCount = Number(form.letterCount.value) || 1;
      const useNumbers = form.number.checked;
      // const numberCount = Number(form.numberCount.value) || 1;
      const useSpecial = form.special.checked;
      const specialCount = Number(form.specialCount.value) || 1;
      const specialRange = form.specialRange.value;
      const pass = [];

      if (useSpecial && specialRange) {
        for (let i = 0; i < specialCount; i++) {
          pass.push(
            specialRange[Math.round(Math.random() * 99) % specialRange.length]
          );
        }
      }
      if (useLetters) {

        for (let i = 0; i < letterCount; i++) {
          pass.push(letters[Math.round(Math.random() * 99) % letters.length]);
        }
      }
      if (useNumbers) {
        const n = length - letterCount - specialCount;
        for (let i = 0; i < n; i++) {
          pass.push(numbers[Math.round(Math.random() * 99) % numbers.length]);
        }
      }

      if (pass.length === 0) {
        return '';
      }
      pass.sort(() => Math.round(Math.random() * 99) % 2 ? 1 : -1);

      return pass.join('');
    }
    const getPass = () => {
      const s = generatePassword();
      if (s) passwordInput.value = s;
    };
    // form.onchange = getPass;

    form.onsubmit = (e) => {
      e.preventDefault();
      getPass();
    };
    btn.onclick = (e) => {
      e.preventDefault();
      getPass();
    };
    copyBtn.onclick = () => {
      passwordInput.select();
      document.execCommand('copy');
      navigator.clipboard.writeText(passwordInput.value);
    };
    getPass();




    const form1 = document.getElementById('form1');
    const btn1 = document.getElementById('btn1');
    const copyBtn1 = document.getElementById('copy1');
    const uuidInput = document.getElementById('uuid');
    function getUuid() {
      const temp_url = URL.createObjectURL(new Blob());
      const uuid = temp_url.toString(); // blob:https://xxx.com/b250d159-e1b6-4a87-9002-885d90033be3
      URL.revokeObjectURL(temp_url);
      uuidInput.value = uuid.substr(uuid.lastIndexOf('/') + 1);
    }

    form1.onsubmit = (e) => {
      e.preventDefault();

    };
    btn1.onclick = (e) => {
      e.preventDefault();
      getUuid();
    };
    copyBtn1.onclick = () => {
      uuidInput.select();
      document.execCommand('copy');
      navigator.clipboard.writeText(uuidInput.value);
    };
    getUuid()
  </script>
</body>

</html>
