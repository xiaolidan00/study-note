<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>浏览器TTS语音合成</title>
  <style>
    body {
      padding: 0;
      margin: 0;
      position: absolute;
      height: 100%;
      width: 100%;
      background-color: #f0f4fa;
      text-align: center;
    }

    * {
      box-sizing: border-box !important;
      font-family: Verdana, Geneva, Tahoma, sans-serif;
    }

    ::-webkit-scrollbar {
      background: transparent;
      height: 8px;
      width: 8px;
      border: none;
      cursor: pointer;
    }

    ::-webkit-scrollbar-thumb {
      background: #ccc;
      border-radius: 5px;
    }

    ::-webkit-scrollbar-corner {
      background-color: transparent;
    }

    textarea {
      height: calc(100% - 52px);
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      display: block;
      font-size: 16px;
      line-height: 2;
      padding: 10px;
      outline: none;
      border: none;
      background-color: white;
      text-align: left;
    }

    .el-button {
      display: inline-block;
      color: white;
      background-color: cornflowerblue;
      border: none;
      outline: none;
      padding: 0 16px;
      border-radius: 4px;
      line-height: 32px;
      height: 32px;
    }

    .el-button:hover,
    .el-button:active {
      background-color: dodgerblue;
    }
  </style>
</head>

<body>
  <div style="display: inline-flex;gap: 10px;padding: 10px;max-width: 800px;margin: 0 auto;">
    <button class="el-button" id="playBtn">播放</button>
    <button class="el-button" onclick="readCursor()">从光标处朗读</button>
    <button class="el-button" onclick="readSelect()">朗读选中部分</button>
  </div>
  <textarea placeholder="请输入朗读内容" id="text"></textarea>
  <script>
    class TTSUtuil {
      current = {
        text: '',
        start: ''
      }
      constructor(dom, endCb) {
        this.textarea = dom;
        this.endCb = endCb
      }
      //播放新的文本内容
      speak() {
        this.stop();
        this.isPlay = true;
        const t = new SpeechSynthesisUtterance(this.current.text);
        t.rate = 1;
        t.volume = 1;
        const textarea = this.textarea;
        t.onboundary = (e) => {
          //文本播放高亮
          const start = this.current.start + e.charIndex;
          const end = start + e.charLength;
          if (textarea.setSelectionRange) {
            textarea.focus();
            textarea.setSelectionRange(start, end);
          }
        };
        t.onend = () => {
          if (this.endCb) {
            this.endCb()
          }
          this.stop()

          alert('内容播放完毕！');
        };
        t.onerror = (err) => {
          console.log('tts Error', err);
        };
        speechSynthesis.speak(t);
        this.tts = t;
      }
      setContent(text, start) {
        this.stop()
        this.current.text = text;
        this.current.start = start;
      }
      async play() {
        this.isPlay = true;
        if (this.tts) {
          //暂停重新播放
          speechSynthesis.resume();
        } else {
          this.speak();
        }
      }
      //暂停播放
      pause() {
        this.isPlay = false;
        speechSynthesis.pause();
      }
      stop() {
        speechSynthesis.cancel();
        this.isPlay = false;
        this.tts = undefined
      }
    }

    const textarea = document.getElementById('text')
    const btn = document.getElementById('playBtn')
    const ttsUtil = new TTSUtuil(textarea, () => {
      btn.innerHTML = '播放'
    })

    textarea.onchange = () => {
      ttsUtil.setContent(textarea.value, 0)
    }

    btn.onclick = () => {
      if (textarea.value) {
        if (ttsUtil.isPlay) {
          ttsUtil.pause()
          btn.innerHTML = '播放'
        } else {
          ttsUtil.play()
          btn.innerHTML = '暂停'
        }
      }
    }

    function readCursor() {
      const { selectionStart, selectionEnd } = textarea;
      const val = textarea.value.substring(selectionStart)
      if (val) {
        ttsUtil.setContent(val, selectionStart || 0)
        ttsUtil.play();
        btn.innerHTML = '暂停'
      }
    }
    function readSelect() {
      const { selectionStart, selectionEnd } = textarea;
      const val = textarea.value.substring(selectionStart, selectionEnd)
      if (val) {
        ttsUtil.setContent(val, selectionStart)
        ttsUtil.play();
        btn.innerHTML = '暂停'
      } else {
        alert('未选中阅读内容');
      }
    }
  </script>
</body>

</html>
